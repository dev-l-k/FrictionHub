<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .converter {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }
        /* Renamed to match HTML class */
        .currency-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            align-items: center;
        }
        .result {
            text-align: center;
            padding: 20px;
            margin-top: 15px;
            border-radius: 12px;
            background: #f4f4f5;
        }
        .amount {
            font-size: 28px;
            font-weight: bold;
        }
        .muted {
            color: #71717a; /* Legible contrast */
        }
        .error {
            color: #dc2626;
            margin: 0;
            font-size: 14px;
        }
        .currency-row select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d4d4d8;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
        }
        .swap-btn {
            width: 45px;
            height: 45px;
            padding: 0;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            border: 1px solid #d4d4d8;
            background: #fff;
        }
        @media (max-width: 600px) {
            .currency-row {
                grid-template-columns: 1fr;
            }
            .swap-btn {
                margin: 0 auto;
            }
        }
        #result{
            color:black;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="../" class="logo">Friction<span>Hub</span></a>
        <div class="time" id="time">00:00:00</div>
    </header>
    <main class="container">
        <div class="card">
            <h1>Currency Converter</h1>
            <p>Convert currencies using live API data.</p>
            <div class="converter">
                <input type="number" id="amount" value="1" min="0" step="any" oninput="convert()">
                <div class="currency-row">
                    <select id="from" onchange="convert()"></select>
                    <button class="swap-btn" onclick="swap()" aria-label="Swap currencies">⇄</button>
                    <select id="to" onchange="convert()"></select>
                </div>
                <p class="error" id="error"></p>
                <div id="result"></div>
            </div>
        </div>
    </main>
    <footer>
        Currency Converter - FrictionHub
    </footer>
    <script src="script.js"></script>
</body>
</html>
