<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placeholder maker</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .row4{
            display:grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap:12px;

        }
        .fld label{
            display:block;
            color:#a8a8b8;
            font-size:13px;
            margin-bottom: 6px;
            

        }
        .fld input[type="number"]{
            width:100%;
            padding:13px;
            background:#1a1a26;
            color:#fff;
            border:1px solid #333344;
            border-radius: 10px;
            font-size:14px;
            outline:none;
        }
        .fld input[type="number"]:focus{
            border-color: #ffd866;
        }
        .fld input[type="color"]{
            width:100%;
            height:42px;
            padding:2px;
            background:#1a1a26;
            border:1px solid #333344;
            border-radius: 10px;
            cursor:pointer;

        }
        .preview-area{
            display:flex;
            align-items: center;
            justify-content: center;
            min-height: 260px;
            padding:20px;
            background:#1a1a26;
            border:1px solid #333344;
            border-radius: 20px;
            margin-top: 20px;
            overflow:auto;
        }
        .preview-area img{
            max-width:100%;
            max-height:400px;
            border-radius: 8px;
        }
        .url-show{
            margin-top: 16px;
            padding:14px;
            background-color: #1a1a26;
            border:1px solid #333344;
            border-radius: 12px;
            color:#ffd866;
            font-family:Consolas,monospace;
            font-size: 13px;
            word-break:break-all;
            line-height: 1.5;
        }
        .good{
            color:#6ee7a8;
            font-size:13px;
            margin-left: 10px;
            
        }
        @media(max-width: 600px){
            .row4{
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <a href="../" class="logo">Friction<span>Hub</span></a>
        <div class="time" id="time">00:00:00</div>
    </header>
    <main class="app-page">
        <div class="app-header">
            <h1>Placeholder Maker</h1>
            <p>Quick Placeholderimages for mockups and layouts</p>
        </div>
        <div class="card">
            <div class="row4">
            <div class="fld">
                <label>Width</label>
                <input type="number" id="w" value="600">
            </div>
            <div class="fld">
                <label>Height</label>
                <input type="number" value="400" id="h">
            </div>
            <div class="fld">
                <label>Background</label>
                <input type="color" value="#242435" id="bg">
            </div>
            <div class="fld">
                <label>Text color</label>
                <input type="color" value="#ffd866" id="fg">
            </div>
        </div>
        <div class="fld" style="margin-top:16px">
        <label>Text(leave empty if use size)</label>
        <input type="text" id="txt" placeholder="600 x 400" maxlength="40">
        </div>
        <div class="button-row" style="margin-top: 16px;">
        <button class="btn-primary" onclick="make()">Generate</button>
        <button class="btn-danger" onclick="resetAll()">Reset</button></div>
        <div class="preview-area">
        <img id="preview" alt="">
        </div>
        <div class="url-show" id="urlBox"></div>
        <div class="button-row" style="margin-top: 14px;">
        <button class="btn-primary" onclick="copyUrl()">Copy URL</button>
        
        <button class="btn-primary" onclick="openImg()">Open image</button>
        <span class="good" id="okMsg"></span>
        </div>
        </div>
        <a id="open" style="display:none;"></a>
        
    </main>
    <footer>FrictionHub - For a smooth digital life</footer>
    <script src="script.js"></script>
</body>
</html>
