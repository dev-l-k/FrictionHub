<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON formatter</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .json-buttons{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-top:15px;
        }
        #json{
            min-height: 300px;
            font-family:monospace;
        }
        #result{
            min-height: 300px;
            font-family: monospace;
        }
        .status{
            margin-top: 15px;
            color: #f5f5f5;

        }
        .success{
            color: #72d68a;

        }
        .error{
            color:lightcoral;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="../" class="logo">
        Friction<span>Hub</span>
        </a>
        <div class="time" id="time">00:00:00</div>
    </header>
    <main class="container">
        <div class="card">
            <h1>JSON Formatter</h1>
            <p>Format minify and validate JSON instantly</p>
            <div class="app-group">
                <label>JSON</label>
                <textarea id="json" placeholder='{"name":"John","age":25,"city":"New York"}'></textarea>
            </div>
            <div class="json-buttons">
                <button class="btn-primary" onclick="formatJSON()">
                    Format
                </button>
                <button class="btn-small" onclick="minifyJSON()">Minify</button>
                <button class="btn-small" onclick="copyJSON()">Copy</button>
                <button class="btn-danger btn-small" onclick="clearJSON()">Clear</button>
                <button class="btn-primary" onclick="loadDemo()">Load Demo</button>
            </div>
            <p id="status" class="status"></p>
            <div class="app-group">
                <p class="status" id="status"></p>
                <div class="app-group">
                    <label>Result</label>
                    <textarea id="result" readonly placeholder="Formatted JSOn comes here...">
                        
                    </textarea>
                </div>
            </div>
        </div>
    </main>
    <footer>
        JSON formatter - FrictionHub
    </footer>
    <script src="script.js"></script>
</body>
</html>
