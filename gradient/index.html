<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Generator</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        main{
            max-width: 900px;
            margin:30px auto;
            padding: 20px;
        }
        .preview{
            height:300px;
            border-radius: 16px;
            margin:25px 0;
            border:1px solid #111;

        }
        .controls{
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap:15px;
        }
        .feild{
            background: #333;
            padding:16px;
            border-radius: 12px;
            border: 1px solid #111;
            
        }
        .feild label{
            display:block;
            margin-bottom: 12px;
        }
        input[type=color]{
            width:100%;
            height:45px;
            border: 0;
            background:none;
            cursor: pointer;
        }
        input[type=range]{
            width:100%;
            accent-color: black;
        }
        select{
            width:100%;
            padding:12px;
            background:#222;
            color:whitesmoke;
            border: 1px solid #111;
            border-radius: 8px;

        }
        .presets{
            display:flex;
            flex-wrap: wrap;
            gap:10px;
            margin:30px 0;
        }
        .preset{
            width:65px;
            height:45px;
            border:1px solid #111;
            border-radius:8px;
            cursor: pointer;
        }
        .output{background:#333;
            padding:16px;
            border:1px solid #111;
            border-radius:12px;
            overflow-wrap:anywhere;

        }
        .output code {
            display:block;
            margin-bottom: 15px;
            color:whitesmoke;

        }
        @media(max-width:500px){
            .controls{grid-template-columns:1fr;}
            .preview{height:220px;}
        }
        .card{
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="../" class="logo">Friction<span>Hub</span></a>
        <div class="time" id="time">00:00:00</div>
        </header>
        <main class="app-page">
            <section class="app-title">
                <h1>Gradient Generator</h1>
                <p>Create beutiful CSS gradients and copy them instantly.</p>
            </section>
            <div class="card">
                <div class="preview" id="preview"></div>
                <div class="controls">
                    <div class="field">
                        <label for="color1">First Color</label>
                        <input type="color" id="color1" value="#ff0000">

                    </div>
                    <div class="field">
                        <label for="color2">Second Color</label>
                        <input type="color" id="color2" value="#00ff00">
                    </div>
                    <div class="feild">
                        <label for="angle">Gradient Angle : <span id="angleValue">135°</span></label>
                        <input type="range" id="angle" min="0" max="360" value="135">
                    </div>
                    <div class="feild">
                        <label for="type">Gradient Type</label>
                        <select id="type">
                            <option value="linear">Linear</option>
                            <option value="radial">Radial</option>
                        </select>
                    </div>
                </div>
                <h3 style="margin-top:20px;">Presets</h3>
                <div class="presets" id="presets"></div>
                <h3>CSS Output</h3>
                <div class="output">
                    <code id="css"></code>
                    <button class="btn-primary" onclick="copyCSS()">Copy CSS</button>
                </div>

            </div>
        </main>
        <footer>
            Gradient Generator - FrictionHub
        </footer>
        <script src="script.js"></script>
    
</body>
</html>
