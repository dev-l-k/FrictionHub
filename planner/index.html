<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Planner</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .planner{
            max-width:950px;
            margin:30px auto;
            padding:0 16px;


        }
        .planner-head{
            display:flex;
            justify-content: space-between;
            align-items: center;
            gap:12px;
            flex-wrap:wrap;
            margin-bottom:22px;

        }
        .planner-head h1{
            margin-bottom:6px;
        }
        .date-control{
            background: #222;
            border:1px solid #666;
            border-radius: 10px;
            padding:10px;

        }
        .summary{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:12px;
            margin-bottom: 20px;
        }
        .summary-card{
            background:#222;
            border:1px solid #666;
            border-radius: 12px;
            padding:18px;
        }
        .summary-card strong{
            display:block;
            font-size:25px;
            
        }
        .summary-card span{
            font-size:13px;
            
        }
        .progress-track{
            height:7px;
            background:#333;
            border-radius:8px;
            overflow:hidden;
            margin-top: 12px;
        }
        .progress-fill{
            height:100%;
            width:0;
            background:#222;
            transition:width .2s;
            
        }
        .panel{
            background:#222;
            border:1px solid #666;
            border-radius: 12px;
            padding:22px;
            margin-bottom: 20px;
        }
        .panel h2{
            font-size: 19px;
            margin:0 0 16px;

        }
        .task-form{
            display:grid;
            grid-template-columns: 1fr 130px 130px auto;
            gap:10px;
        }
        .task-form input,.task-form select,.task-filters select{
            min-width:0;
            width:100%;
            background:#222;
            border:1px solid #666;
            border-radius: 9px;
            padding:12px;
        }
        .task-list{
            display:grid;
            gap:10px;

        }
        .task{
            display:flex;
            align-items:center;
            gap:12px;
            background:#333;
            border:1px solid #666;
            border-radius: 12px;
            padding:14px;


            
        }
        .task-check{
            width:19px;
            height:19px;
            flex-shrink:0;

        }
        .task-info{
            flex:1;
            min-width:0;
        }
        .task-title{
            overflow-wrap: anywhere;
            font-weight:600;
        }
        .task.done .task-title{
            text-decoration: line-through;

        }
        .task-meta{
            font-size:12px;
            margin-top: 5px;
        }
        .priority{
            font-size:11px;
            padding:4px 7px;
            border-radius:6px;
            background:#333;
            white-space: nowrap;

        }
        .priority.High{
            color:rosybrown;
        
        }
        .priority.Medium{
            color:white;
        }

        .delete-btn{
            background:transparent;
            border:1px solid #666;
            border-radius:8px;
            padding:7px 10px;
            cursor:pointer;

        }
        .delete-btn:hover{
            color:rosybrown;
            border-color:rosybrown;
        }
        .task-filters{
            display:flex;
            gap:10px;
            flex-wrap: wrap;
            margin-bottom:14px;

        }

        .task-filters select{
            width:auto;
        }

        .empty{
            text-align:center;
            padding:30px 12px;
            color:var(--muted)
        }
        .panel-top{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:12px;
            flex-wrap:wrap
        }
        @media(max-width:650px){
            .task-form{
                grid-template-columns:1fr 1fr
            }
            .task-form input:first-child{
                grid-column:1/-1
            }
            .summary-card{padding:13px}
            .summary-card strong{font-size:21px}
            .panel{padding:16px}
        }
        @media(max-width:390px){
            .task-form{grid-template-columns:1fr}
            .task-form input:first-child{grid-column:auto}
            .summary{gap:7px}
            .summary-card span{font-size:11px}
        }

    </style>
</head>
<body>
    <header class="topbar">
        <a href="./" class="logo">
            Friction<span>Hub</span>
        </a>
        <div class="time" id="time">00:00:00</div>
    </header>
    <main class="planner">
        <div class="planner-head">
            <div>
                <h1>Daily Planner</h1>
                <p>Plan Your day, one Task at a time</p>

            </div>
            <input class="date-control" type="date" id="planDate" aria-label="Planner date">
        </div>
        <section class="summary">
            <div class="summary-card">
                <strong id="totalTasks">0</strong>
                <span>Total tasks</span>

            </div>
            <div class="summary-card">
                <strong id="completedTasks">0</strong>
                <span>Completed</span>
            </div>
            <div class="summary-card">
                <strong id="progressText">0%</strong>
                <span>Daily progress</span>
                <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

        </section>

        <section class="panel">
            <h2>Add tasks</h2>
            <form class="task-form" id="taskForm">
                <input id="taskTitle" type="text" maxlength="120" placeholder="What do you need to do?" required>
                <input type="time" id="taskTime" aria-label="Task time">
                <select id="taskPriority" aria-label="Task taskPriority" >
                    <option value="Low">Low priority</option>
                    <option value="Medium">Medium priority</option>
                    <option value="High">High priority</option>
                </select>
                <button type="submit" class="btn-primary">Add Task</button>
            </form>
        </section>
        <section class="panel">
            <div class="panel-top">
                <h2>Your Schedule</h2>
                <button class="btn-small" type="button" onclick="clearCompleted()">Clear Completed</button>
            </div>
            <div class="task-filters">
                <select id="filterStatus" aria-label="Filter tasks">
                    <option value="all">All tasks</option>
                    <option value="active">Remaining</option>
                    <option value="done">Completed</option>
                </select>
                <select id="filterPriority" aria-label="Filter priority">
                    <option value="all">All priorities</option>
                    <option value="High">High priority</option>
                    <option value="Medium">Medium priority</option>
                    <option value="Low">Low priority</option>
                </select>
            </div>
            <div class="task-list" id="taskList"></div>
        </section>
        <p>Your tasks are saved in your browser</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
